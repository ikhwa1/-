.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.card {

display: flex;

align-items: center;
gap: 8px;

.card:active { transform: scale(0.97); box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.card .emoji-badge {
width: 50px; height: 50px;
border-radius: 50%;
display: flex; align-items: center; justify-content: center;
font-size: 24px;
}
.card .cat-name {
font-size: 15px; font-weight: 700; letter-spacing: 0.2px;
color: #2b2b2b;
}
.card .count {

padding: 2px 10px; border-radius: 20px;
background: #f4f3f1;
}
.theme-한식 .emoji-badge { background: #f3e6e1; }
.theme-중식 .emoji-badge { background: #f2ebdd; }
.theme-양식 .emoji-badge { background: #e6edf1; }
.theme-일식 .emoji-badge { background: #ece7ef; }
.theme-간식 .emoji-badge { background: #f3e5ea; }
.subgrid .card { padding: 18px 10px; }
.subgrid .card .cat-name { font-size: 14.5px; font-weight: 700; color: #2b2b2b; }
.subgrid .card .count { background: #f1f2f5; color: #999; font-weight: 400; }
.restaurant {
background: #fff;
border-radius: 14px;
padding: 16px;
margin-bottom: 12px;
box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.restaurant .head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.restaurant .name { font-size: 17px; font-weight: 800; flex-grow: 1; }
.tag { font-size: 11px; padding: 3px 8px; border-radius: 12px; font-weight: 600; white-space: nowrap; }
.tag.off { background: #fbeceb; color: #a04c43; border: 1px solid #f0d6d3; }
.addr { font-size: 13px; color: #555; margin-top: 6px; }
.phone { font-size: 13px; margin-top: 2px; }
.phone a { color: #3d5871; text-decoration: none; font-weight: 600; }
.phone a:active { opacity: 0.7; }
.note {
font-size: 13px; color: #666; margin-top: 8px; line-height: 1.5;
background: #f8f9fb; padding: 8px 10px; border-radius: 8px;
}
.btn-row { margin-top: 10px; display: flex; gap: 8px; }

text-decoration: none; font-size: 13px; font-weight: 700;
padding: 12px 0; border-radius: 10px;

.back-btn {

background: #333; color: #fff; border-radius: 10px; font-size: 14px; font-weight: 600;

.empty { text-align: center; color: #aaa; padding: 50px 0; font-size: 14px; }

left: 50%; transform: translateX(-50%);

const catOrder = ["한식","중식","양식","일식","간식"];
const catEmoji = {"한식":"🍚","중식":"🥢","양식":"🍝","일식":"🍣","간식":"🍡"};
let state = { cat: null, sub: null };
function getUrl(r) {
if (r.addr) {
return "https://map.naver.com/p/search/" + encodeURIComponent(r.name);
} else {
return "https://search.naver.com/search.naver?query=" + encodeURIComponent(r.name);
}
}
function hasAddr(r) {
return r.addr && r.addr.trim() !== "";
}
function telHref(phone) {
return "tel:" + phone.replace(/-/g, "");
}
function render() {
var app = document.getElementById("app");
var crumb = document.getElementById("breadcrumb");
app.innerHTML = "";
var bc = "<span onclick=\"goHome()\">전체</span>";
if (state.cat) bc += " › <span onclick=\"goCat(&quot;" + state.cat + "&quot;)\">" + state.cat + "</span>";
if (state.sub) bc += " › " + state.sub;
crumb.innerHTML = bc;
document.getElementById("home-fab").style.display = state.cat ? "block" : "none";
if (!state.cat) {
var total = restaurants.length;
var summary = document.createElement("div");
summary.className = "summary";
summary.innerHTML = "총 <b>" + total + "곳</b>의 맛집이 등록되어 있어요";
app.appendChild(summary);
var cats = catOrder.filter(function(c) { return restaurants.some(function(r){ return r.cat === c; }); });
var grid = document.createElement("div");
grid.className = "grid";
cats.forEach(function(c, idx) {
var count = restaurants.filter(function(r){ return r.cat === c; }).length;
var div = document.createElement("div");
var isLastOdd = (idx === cats.length - 1) && (cats.length % 2 === 1);
div.className = "card theme-" + c + (isLastOdd ? " wide" : "");
div.innerHTML = "<div class=\"emoji-badge\">" + (catEmoji[c] || "🍴") + "</div><div class=\"cat-name\">" + c + "</div><div class=\"count\">" + count + "곳</div>";
div.addEventListener("click", function(){ goCat(c); });
grid.appendChild(div);
});
app.appendChild(grid);
} else if (!state.sub) {
var backBtn = document.createElement("div");
backBtn.className = "back-btn";
backBtn.innerText = "‹ 뒤로";
backBtn.addEventListener("click", goHome);
app.appendChild(backBtn);
var subs = restaurants.filter(function(r){ return r.cat === state.cat; }).map(function(r){ return r.sub; });
subs = subs.filter(function(item, pos){ return subs.indexOf(item) === pos; });
var grid2 = document.createElement("div");
grid2.className = "grid subgrid";
subs.forEach(function(s) {
var count = restaurants.filter(function(r){ return r.cat === state.cat && r.sub === s; }).length;
var div = document.createElement("div");
div.className = "card";
div.innerHTML = "<div class=\"cat-name\">" + s + "</div><div class=\"count\">" + count + "곳</div>";
div.addEventListener("click", function(){ goSub(s); });
grid2.appendChild(div);
});
app.appendChild(grid2);
} else {
var backBtn2 = document.createElement("div");
backBtn2.className = "back-btn";
backBtn2.innerText = "‹ 뒤로";
backBtn2.addEventListener("click", function(){ goCat(state.cat); });
app.appendChild(backBtn2);
var items = restaurants.filter(function(r){ return r.cat === state.cat && r.sub === state.sub; });
if (items.length === 0) {
var emptyDiv = document.createElement("div");
emptyDiv.className = "empty";
emptyDiv.innerText = "등록된 맛집이 없습니다";
app.appendChild(emptyDiv);
}
items.forEach(function(r) {
var div = document.createElement("div");
div.className = "restaurant";
var btnClass = hasAddr(r) ? "naver-btn" : "naver-btn disabled";
var btnText = hasAddr(r) ? "⭐ 사진/리뷰 보기" : "🔍 네이버 검색";
var html = "<div class=\"head\"><span class=\"name\">" + r.name + "</span>";
if (r.off) html += "<span class=\"tag off\">휴무: " + r.off + "</span>";
html += "</div>";
if (r.addr) html += "<div class=\"addr\">📍 " + r.addr + "</div>";
if (r.phone) html += "<div class=\"phone\">☎ <a href=\"" + telHref(r.phone) + "\">" + r.phone + "</a></div>";
if (r.menu) html += "<div class=\"note\">🍴 " + r.menu + "</div>";
if (r.note) html += "<div class=\"note\">💬 " + r.note + "</div>";
html += "<div class=\"btn-row\"><a class=\"" + btnClass + "\" href=\"" + getUrl(r) + "\" target=\"_blank\" rel=\"noopener\">" + btnText + "</a></div>";
div.innerHTML = html;
app.appendChild(div);
});
}
}
function goHome() { state = { cat: null, sub: null }; render(); window.scrollTo(0,0); }
function goCat(c) { state = { cat: c, sub: null }; render(); window.scrollTo(0,0); }
function goSub(s) { state.sub = s; render(); window.scrollTo(0,0); }
render();
</script>
